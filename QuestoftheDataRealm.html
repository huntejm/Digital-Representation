</style><main><header><div><div class="eyebrow">A MEMORY & STORAGE ADVENTURE</div><h1>Quest of the Data Realm</h1></div><button onclick="journal()">Quest journal</button></header><div class="hud" id="hud"></div><div class="layout"><section><div class="objective" id="objective"></div><canvas id="world" width="800" height="480" tabindex="0" aria-label="Exploration map. Arrow keys or WASD move; E interacts. Objects and positions are listed beside the map."></canvas><div id="notice" role="status" aria-live="polite"></div><div class="row"><button class="primary" onclick="interact()">Interact · E / Space</button><button onclick="rest()">Return to camp / heal</button><button onclick="help()">How to play</button></div><div class="pad"><span></span><button aria-label="Move up" onclick="move(0,-1)">▲</button><span></span><button aria-label="Move left" onclick="move(-1,0)">◀</button><button aria-label="Move down" onclick="move(0,1)">▼</button><button aria-label="Move right" onclick="move(1,0)">▶</button></div></section><aside class="panel"><div class="eyebrow">CURRENT LAND</div><h2 id="land"></h2><p id="mission"></p><div id="legend"></div><h3>Collected relics</h3><div class="relics" id="relics"></div><p id="save" class="muted"></p><button onclick="report()">Progress report</button><button onclick="newPrompt()">New adventure</button></aside></div></main><dialog id="modal" aria-label="Adventure dialogue"><div id="content"></div></dialog><script>
const L=[
{n:"Forgetful Forest",e:"🧚",t:"Memory vs. Storage",k:"RAM is fast but forgets without power (volatile). Storage is slower but keeps data (non-volatile).",
l:"<p>Every computer keeps data in two different places. <b>Memory (RAM)</b> is the CPU’s short-term workspace. It is extremely fast, but it is <b>volatile</b>: the moment power is lost, everything in it disappears.</p><p><b>Storage</b> (a hard drive or SSD) is <b>non-volatile</b>: it keeps files for years, even when unplugged, but it is slower. When you open a program, the computer <b>copies it from storage into RAM</b>. When you press <b>Save</b>, it copies your work from RAM back into storage. Unsaved work lives only in RAM!</p>",
q:[["The forest guard asks: which part forgets everything when the castle power goes out?","RAM","SSD","Hard drive","USB flash drive"],["You saved your map file. After a blackout you reopen it. Why is it still there?","Storage is non-volatile and keeps data without power","RAM kept a copy","The CPU memorized it","The monitor stored it"],["A fairy says: “Which job belongs to RAM?”","Holding programs and data being used right now","Keeping photos for years","Backing up the school","Connecting to Wi-Fi"],["You typed a report but have not saved. What will pressing Save do?","Copy the data from RAM to storage","Move the CPU to the drive","Erase the RAM","Turn the report into hardware"],["Desk and filing cabinet: RAM is the desk. Storage is the…","Filing cabinet","Light switch","Calculator","Printer"]]},
{n:"Desk Tower",e:"🧙",t:"How RAM Is Used",k:"Programs run from RAM. More RAM = more things open at once. Drive size decides how much you can save.",
l:"<p>RAM is made of fast electronic chips on a stick plugged into the motherboard. It is measured in <b>gigabytes (GB)</b>; modern computers often have 8 to 32 GB. Everything you are running right now (the browser, a game, music) is holding space in RAM.</p><p>If RAM fills up, the computer has to shuffle data back and forth with the drive, and everything slows. More RAM helps with <b>multitasking</b>. RAM does <b>not</b> change how many files you can save; that is the drive’s job.</p>",
q:[["The wizard’s PC has 4 GB RAM and crawls with 40 tabs open. Best free fix?","Close tabs and programs not in use","Delete photos from the drive","Turn the brightness down","Rename the files"],["When you launch a game, data is copied from where to where?","Storage into RAM","RAM into storage","Monitor into RAM","Keyboard into the drive"],["Which upgrade most helps running many programs at once?","More RAM","A bigger monitor","A new mouse","A longer cable"],["PC: 16 GB RAM, 512 GB drive. You want to store 200 GB of video. Which number matters?","The 512 GB drive","The 16 GB RAM","They are added together","Neither"],["Why is RAM so much faster than a hard drive?","Electronic chips built for instant access to active data","It is physically bigger","It is magnetic","It is far from the CPU"]]},
{n:"Address Alley",e:"📮",t:"Memory Addresses",k:"Memory is a long row of bytes. Each byte has a unique address (starting at 0) so the CPU can find it.",
l:"<p>Memory is a long row of tiny boxes called <b>bytes</b>. To find one, the CPU needs a number, just like a mail carrier needs a house number. That number is the byte’s <b>address</b>. The first byte is address <b>0</b>, the next is 1, then 2, and so on.</p><p>The CPU sends the address along the <b>address bus</b> and memory sends back the data stored there. Programmers and technicians often write addresses in <b>hexadecimal</b> (base 16), like <code>0x1F</code>. If two programs write to the same address, the later one <b>overwrites</b> the earlier one’s data.</p>",
q:[["The mail carrier asks: what is a memory address?","A unique number that identifies one byte’s location","A website link","The name of a file","The brand of the RAM"],["The CPU needs the data stored at address 5. Why does it use addresses?","To find exactly where the data is","To change the screen color","To charge the battery","To name the user"],["Memory addresses normally begin at which number?","0","1","100","-1"],["Two programs write to address 0x2000. What happens?","The later write overwrites the earlier data","Both are stored together","RAM grows bigger","Nothing"],["What number system is 0x1F written in?","Hexadecimal","Binary only","Roman numerals","Decimal only"]]},
{n:"Doubling Bridge",e:"🧌",t:"Counting Addresses",k:"n address bits give 2ⁿ addresses. Each added bit doubles the total. 32 bits ≈ 4 GB.",
l:"<p>How many addresses can a computer use? It depends on how many <b>bits</b> (0s and 1s) make up an address. With <b>n</b> bits you get <b>2ⁿ</b> different addresses. 1 bit gives 2, 2 bits give 4, 3 bits give 8, and so on. <b>Every extra bit doubles the total.</b></p><p>8 bits gives 256 addresses. A <b>32-bit</b> system has 2³² addresses, about 4.29 billion, which equals <b>4 GiB</b> (often called 4 GB) of byte-addressable memory. This describes a 32-bit byte address space; usable RAM also depends on the operating system, hardware, and address extensions. <b>64-bit</b> systems can address vastly more.</p>",
q:[["The troll asks: how many addresses can 3 address bits make?","8","3","6","9"],["How many addresses can 8 bits make?","256","64","8","128"],["A byte-addressed system uses 32-bit addresses, with no address extension. What is its address-space size?","4 GB","8 GB","16 GB","1 TB"],["You add one more address bit. What happens to the number of addresses?","It doubles","It goes up by one","It is cut in half","It stays the same"],["A tiny chip has 10 address lines. How many memory locations can it reach?","1,024","100","10","10,000"]]},
{n:"Spinning Spire",e:"🌀",t:"Hard Disk Drives",k:"HDDs store data magnetically on spinning platters. Big and cheap, but slower and fragile.",
l:"<p>A <b>hard disk drive (HDD)</b> stores data magnetically on one or more spinning metal <b>platters</b>. A <b>read/write head</b> on a moving arm floats just above the surface. Each platter is divided into circular <b>tracks</b>, which are split into <b>sectors</b>, so every piece of data has a spot.</p><p>Because HDDs have <b>moving parts</b>, they are slower than SSDs and can be damaged by drops. They are, however, cheap per terabyte, which makes them great for big archives. When a file is saved in scattered pieces (<b>fragmentation</b>), the head must jump around to collect it, slowing the drive. <b>Defragmenting</b> puts the pieces back together.</p>",
q:[["The spire keeper asks: which part of an HDD actually holds the data?","Magnetic spinning platters","Flash chips","The fan","The power cord"],["Why is an HDD more easily damaged by a drop than an SSD?","It has moving parts like the arm and platters","It is heavier","It uses RAM","It has more memory"],["A school must archive 30 TB cheaply and rarely opens the files. Best choice?","HDDs","RAM sticks","CPU cache","An SSD for every PC"],["What is fragmentation?","Pieces of one file scattered across the platter","Cracks in the case","Corrupted RAM","Lost Wi-Fi packets"],["Tracks and sectors are used to…","Organize where data sits on the platter","Cool the drive","Connect to Wi-Fi","Display video"]]},
{n:"Flash Fortress",e:"⚡",t:"Solid State Drives",k:"SSDs use flash chips with no moving parts: fast, quiet, durable. Never defragment them.",
l:"<p>A <b>solid state drive (SSD)</b> stores data in <b>flash memory</b> chips (NAND). With <b>no moving parts</b> it is far faster, silent, and more shock resistant than an HDD, which is why laptops boot in seconds with one. The trade-off is a higher price per gigabyte.</p><p>Flash cells survive a limited number of writes, so the drive spreads writes around (<b>wear leveling</b>) and uses <b>TRIM</b> to tidy unused blocks. Because an SSD has no head to move, fragmentation does not slow it, so <b>you should not defragment an SSD</b>: it only adds wear.</p>",
q:[["The fortress captain asks: why is an SSD faster than an HDD?","No moving parts; flash is read electronically","It spins faster","It uses more power","It has bigger platters"],["A technician wants to defragment your SSD weekly. Best reply?","No, it gains nothing and adds wear","Yes, every day","Yes, it spins","Only on Fridays"],["A laptop rides in a backpack all day. Why choose an SSD?","No moving parts, so bumps are less risky","It never needs power","It uses RAM","It is always cheaper"],["What does wear leveling do?","Spreads writes evenly across flash cells","Makes the SSD spin evenly","Deletes old files","Boosts the CPU"],["Which is generally more expensive per gigabyte?","SSD","HDD","They cost the same","Paper"]]},
{n:"Folder Grove",e:"🌳",t:"File Systems & Directories",k:"A file system tracks files in a tree of folders. A path lists drive, folders, then the file.",
l:"<p>A drive is just billions of bytes until a <b>file system</b> (such as NTFS, APFS, or ext4) organizes them. It keeps track of where each file sits and what it is called. Files are organized into <b>directories</b> (folders), forming an upside-down <b>tree</b> that starts at the <b>root</b>, like <code>C:\\</code>.</p><p>A <b>path</b> is the address of a file: <code>C:\\Users\\Sam\\Docs\\essay.docx</code> lists the drive, each folder, and finally the file. A <b>relative path</b> starts from where you are; <code>..</code> means “go up one folder.” The same file name can exist in different folders.</p>",
q:[["The tree sprite asks: in C:\\Users\\Sam\\Docs\\essay.docx, which is the file?","essay.docx","Docs","Users","C:"],["What does a file system do?","Tracks where files are stored and organizes them into folders","Speeds up the CPU","Draws the graphics","Charges the battery"],["Which is the root of the tree?","The top-level directory, such as C:\\","essay.docx","Docs","Sam"],["You are in C:\\Users\\Sam\\Docs. The path ..\\Pictures goes to…","C:\\Users\\Sam\\Pictures","C:\\Users\\Sam\\Docs\\Pictures","C:\\Pictures","C:\\Users\\Pictures\\Docs"],["Two different files are both named notes.txt. When can this be true?","They are in different folders","Never","Only if both are open","Only with lots of RAM"]]},
{n:"Network Harbor",e:"⚓",t:"Network Directories",k:"A file server shares folders over the network. Permissions control who can read or change files.",
l:"<p>In a school, files are often kept on a <b>file server</b>, a computer whose job is to store shared files. Users reach a <b>shared folder</b> through a <b>network path</b> such as <code>\\\\SERVER\\Classes\\Period3</code>. It can be <b>mapped</b> to a drive letter like <code>S:</code> so it looks like a local drive.</p><p><b>Permissions</b> decide who can do what: <b>read-only</b> (view), <b>write/modify</b> (change), or <b>full control</b>. Servers make backups easy and let you log in from any computer, but if you are off the network (or the server is down), you cannot reach those files.</p>",
q:[["The harbor master asks: what does a file server do?","Stores shared files for many users","Prints posters","Cools the lab","Plays music"],["\\\\SERVER\\Classes\\Period3 is an example of…","A network path to a shared folder","A website address","An email address","A RAM address"],["Students must view a worksheet but never change it. Which permission?","Read-only","Full control","Modify","Delete"],["What does mapping a share to S: do?","Gives the network folder a drive letter","Copies the server to your PC","Deletes the folder","Makes it faster than RAM"],["Sam saved to S: at school but can’t open it at home. Why?","It lives on the school server and Sam is off the network","Files vanish at 3 PM","RAM is full","S: only works on SSDs"]]},
{n:"Layer Mountain",e:"🏔️",t:"Virtual Memory & Cache",k:"Memory is layered: cache → RAM → SSD/HDD. Faster layers are smaller. Virtual memory borrows drive space when RAM is full.",
l:"<p>Computers use a <b>memory hierarchy</b>: <b>CPU cache</b> (tiny, blazing fast, on the CPU), then <b>RAM</b>, then <b>SSD/HDD</b>. The faster a layer is, the smaller and more expensive it is. <b>Cache</b> keeps copies of recently used data so the CPU rarely waits; finding data there is a <b>hit</b>, missing it is a <b>miss</b>.</p><p>When RAM fills up, the OS uses part of the drive as <b>virtual memory</b> (a pagefile or swap space), moving less-used chunks called <b>pages</b> out of RAM. Programs keep running, but much slower, because drives are far slower than RAM. Constant drive activity with RAM at 100% is a classic sign.</p>",
q:[["The mountain guide asks: which order is fastest to slowest?","Cache, RAM, SSD, HDD","HDD, SSD, RAM, cache","RAM, cache, HDD, SSD","SSD, cache, RAM, HDD"],["RAM is full, so the OS borrows drive space to act like extra memory. This is called…","Virtual memory","Cache","ROM","A register"],["A PC lags, drive light flickers constantly, RAM at 100%. Most likely cause?","Heavy use of virtual memory (paging)","Too much cache","A dead monitor","A loose network cable"],["The CPU finds the data it needs in cache. This is a…","Cache hit","Cache miss","Crash","Reboot"],["Why not make ALL memory fast cache?","Fast memory is small and costly","Cache can’t store data","Nobody has invented it","It is illegal"]]},
{n:"Vault of Backups",e:"🏰",t:"Capstone: Protect the Data",k:"RAID is not a backup. Use the 3-2-1 rule: 3 copies, 2 media types, 1 off-site.",
l:"<p>Drives fail, get stolen, and people delete things by mistake. A <b>backup</b> is a separate copy you can restore from. The <b>3-2-1 rule</b>: keep <b>3</b> copies of your data, on <b>2</b> different kinds of media, with <b>1</b> copy <b>off-site</b> (such as cloud storage), so a fire or flood cannot destroy every copy.</p><p><b>RAID 1</b> mirrors two drives so one can fail without losing data, but it is <b>not a backup</b>: delete a file and it is deleted from both. A smart system combines everything you learned: SSD for speed, enough RAM, a permissioned file server for sharing, and 3-2-1 backups.</p>",
q:[["The vault keeper: a class stores projects on RAID 1 mirrored drives and a student deletes one. Does RAID help?","No, the deletion is mirrored; a real backup is needed","Yes, RAID restores it","Yes, through RAM","Yes, by defragmenting"],["What does the 3-2-1 rule mean?","3 copies, 2 media types, 1 off-site","3 drives, 2 PCs, 1 user","3 GB, 2 GB, 1 GB","3 passwords, 2 users, 1 admin"],["Which is the best plan for a school lab?","SSD PCs, 16 GB RAM, permissioned file server, nightly + cloud backup","One HDD, 2 GB RAM, no backups","Only RAM, since it is fastest","Full control for everyone, no backups"],["A fire destroys the server room. Which backup survives?","The off-site cloud copy","A copy on the same server","RAM contents","A mirror in the same room"],["A video won’t play smoothly: 4 GB RAM, fast CPU, SSD 80% full. Best first upgrade?","More RAM","A faster monitor","A new keyboard","More USB ports"]]}
];

const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monsters=['👻','🐌','👺','🧌','🐉','🤖','🕷️','🦑','🗿','👾'],names=['Forgetful Ghost','Lag Slug','Address Goblin','Bridge Troll','HDD Dragon','Flash Golem','Path Spider','Network Kraken','Cache Titan','Data Destroyer'],relics=['🔮','🧠','🧭','🗝️','💿','⚡','🌳','⚓','👑','🛡️'];
const reasons=['The ghost is erasing unsaved maps. Recover the Memory Crystal to reopen the forest road.','The slug has overwhelmed the tower workspace. Free the RAM Rune to restart the lift.','The goblin scrambled the mailboxes. Recover the Address Compass to guide the couriers.','The troll locked the bridge with address-bit riddles. Earn the Binary Key to cross.','The dragon hoards the archive platters. Recover the Platter Shield to preserve the records.','The golem is wearing out the flash cells. Claim the Flash Blade to restore the fortress.','The spider tangled every file path. Recover the Root Key to untangle the grove.','The kraken blocks the shared file server. Claim the Network Anchor to reconnect the harbor.','The titan is forcing every request onto slow storage. Recover the Cache Crown to restore the mountain.','The Data Destroyer threatens every remaining copy. Win the Backup Aegis and restore the realm.'];
let s,battle=null,locked=false;const key='data-realm-exploration-v1',modal=$('modal'),ctx=$('world').getContext('2d');
const fresh=()=>({name:'',hero:'🛡️',land:0,x:2,y:6,hp:100,max:100,xp:0,potions:2,done:[],talk:[],chests:[],attempts:Array(10).fill(0),correct:Array(10).fill(0),faints:0,started:Date.now()});
function open(h){$('content').innerHTML=h;if(!modal.open)modal.showModal()}
function closeModal(){modal.close();$('world').focus()}
function save(){try{localStorage.setItem(key,JSON.stringify(s));$('save').textContent='Progress saved on this browser.'}catch{$('save').textContent='Saving unavailable. Keep this tab open and download your report.'}}
function intro(){open(`<div class="eyebrow">THE VAULT IS FAILING</div><h2>A realm worth saving.</h2><p>Ten corrupted guardians hold the relics that protect the kingdom’s data. Walk the lands, learn from their keepers, and use your knowledge in battle.</p><label>Student name<input id="student" maxlength="60" autocomplete="name" placeholder="First and last name"></label><label>Choose your adventurer<select id="hero"><option value="🛡️">Knight — 120 health</option><option value="🧙">Mage — 4 hint potions</option><option value="🏹">Ranger — 25% bonus XP</option><option value="🧝">Elf — 3 hint potions</option><option value="🥷">Scout — 110 health</option></select></label><button class="primary" onclick="begin()">Enter the realm</button>`)}
function begin(){const n=$('student').value.trim();if(!n){$('student').focus();return}s=fresh();s.name=n;s.hero=$('hero').value;s.max=s.hp=s.hero==='🛡️'?120:s.hero==='🥷'?110:100;s.potions=s.hero==='🧙'?4:s.hero==='🧝'?3:2;closeModal();update();help()}
function newPrompt(){open('<h2>Start a new adventure?</h2><p>This replaces the saved adventure on this browser. Download your progress report first if you need it.</p><button onclick="intro()">Start new</button> <button onclick="closeModal()">Keep playing</button>')}
function objects(){return [{x:3,y:4,icon:'🧙',label:'Keeper',type:'guide'},{x:7,y:8,icon:s.chests.includes(s.land)?'📦':'🎁',label:'Chest',type:'chest'},{x:14,y:6,icon:s.done.includes(s.land)?'✨':monsters[s.land],label:'Guardian',type:'enemy'},{x:18,y:6,icon:'🚪',label:'Gate',type:'gate'}]}
function terrain(x,y){if(x===0||y===0||x===19||y===11)return 'tree';if(x===10&&y!==6&&y!==7)return 'water';if((x*7+y*11+s.land*3)%23===0&&y!==6&&y!==7&&!objects().some(o=>Math.abs(o.x-x)+Math.abs(o.y-y)<2))return 'tree';return 'grass'}
function sprite(icon,x,y,size=31){ctx.font=size+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(icon,x,y)}
function draw(){const colors=['#315443','#344c59','#53554c','#3d5e51','#4f4857','#35545e','#36573d','#345264','#505369','#463f5c'];ctx.clearRect(0,0,800,480);for(let y=0;y<12;y++)for(let x=0;x<20;x++){const t=terrain(x,y);ctx.fillStyle=t==='water'?'#245871':(y===6||y===7)?'#9b8e68':colors[s.land];ctx.fillRect(x*40,y*40,40,40);ctx.fillStyle='#ffffff08';ctx.fillRect(x*40+4,y*40+6,3,3);if(t==='tree'){ctx.fillStyle='#183b31';ctx.fillRect(x*40+9,y*40+9,23,25);ctx.fillStyle='#377255';ctx.fillRect(x*40+5,y*40+5,29,19)}if(t==='water'){ctx.fillStyle='#71a6bc';ctx.fillRect(x*40+8,y*40+22,20,2)}if(x===10&&(y===6||y===7)){ctx.fillStyle='#674d36';for(let a=0;a<4;a++)ctx.fillRect(x*40,y*40+a*10,40,3)}}
for(const o of objects()){ctx.fillStyle='#10232ac9';ctx.fillRect(o.x*40-19,o.y*40-17,78,17);ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillStyle='#f5e9bf';ctx.fillText(o.label,o.x*40+20,o.y*40-5);sprite(o.icon,o.x*40+20,o.y*40+20)}ctx.fillStyle='#ffe19b';ctx.fillRect(s.x*40+7,s.y*40+35,26,3);sprite(s.hero,s.x*40+20,s.y*40+19);}
function update(){const done=s.done.includes(s.land);$('hud').innerHTML=`<span>${s.hero} <b>${esc(s.name)}</b></span><span>♥ ${s.hp}/${s.max}</span><span>✦ ${s.xp} XP</span><span>🧪 ${s.potions}</span><span>Relics ${s.done.length}/10</span>`;$('land').textContent=(s.land+1)+'. '+L[s.land].n;$('mission').textContent=reasons[s.land];$('objective').textContent=done?'Route restored! Walk to the gate on the right and interact.':s.talk.includes(s.land)?'Quest: approach the guardian and recover the relic. Optional: find the treasure chest.':'Quest: find the Keeper and press E to learn how to save this land.';$('relics').textContent=s.done.map(i=>relics[i]).join(' ')||'No relics yet';$('legend').innerHTML='<small>Map coordinates (column, row)</small><p>'+objects().map(o=>`${o.icon} ${o.label}: ${o.x+1}, ${o.y+1}`).join('<br>')+`<br>You: ${s.x+1}, ${s.y+1}</p>`;draw();save()}
function tell(t){$('notice').textContent=t}
function move(dx,dy){if(modal.open||!s.name)return;const x=s.x+dx,y=s.y+dy;if(x<0||x>19||y<0||y>11||terrain(x,y)!=='grass'){tell('The path is blocked. Use the bridge across the river.');return}if(objects().some(o=>o.x===x&&o.y===y)){interact(objects().find(o=>o.x===x&&o.y===y));return}s.x=x;s.y=y;update();const o=objects().find(o=>Math.abs(o.x-x)+Math.abs(o.y-y)<=1);tell(o?`${o.label} nearby — press E or Interact.`:'Explore with arrow keys or WASD. Cross the river using the bridge.')}
function interact(o){if(modal.open)return;o=o||objects().find(o=>Math.abs(o.x-s.x)+Math.abs(o.y-s.y)<=1);if(!o){tell('Move next to a keeper, chest, guardian, or gate first.');return}if(o.type==='guide'){if(!s.talk.includes(s.land))s.talk.push(s.land);update();open(`<div class="eyebrow">THE KEEPER’S SCROLL</div><h2>${L[s.land].t}</h2><p>${reasons[s.land]}</p>${L[s.land].l}<div class="objective">${L[s.land].k}</div><button class="primary" onclick="closeModal()">Return to the quest</button>`)}if(o.type==='chest'){if(s.chests.includes(s.land)){tell('You already collected this chest.');return}s.chests.push(s.land);s.potions++;s.xp+=20;update();open('<h2>Treasure discovered!</h2><p>+1 hint potion · +20 exploration XP. In battle, a potion removes two incorrect choices.</p><button onclick="closeModal()">Keep exploring</button>')}if(o.type==='enemy'){if(s.done.includes(s.land)){tell('This guardian has been defeated. The gate is open.');return}if(!s.talk.includes(s.land)){tell('Speak to the Keeper first. The scroll reveals the guardian’s weakness.');return}battle={hp:s.land===4||s.land===9?4:3,max:s.land===4||s.land===9?4:3,turn:0,order:[0,1,2,3,4].sort(()=>Math.random()-.5)};question()}if(o.type==='gate'){if(!s.done.includes(s.land)){tell('The guardian seals this gate. Recover the relic first.');return}if(s.land===9){report();return}s.land++;s.x=2;s.y=6;s.hp=s.max;update();tell('New land reached. Health restored. Find its Keeper.')}}
function question(){locked=false;const q=L[s.land].q[battle.order[battle.turn%5]],answers=q.slice(1).map((t,i)=>({t,ok:i===0})).sort(()=>Math.random()-.5);battle.q=q;open(`<div class="eyebrow">${s.land===4||s.land===9?'BOSS ENCOUNTER':'GUARDIAN ENCOUNTER'}</div><h2>${names[s.land]}</h2><div class="stage"><span id="player" class="fighter">${s.hero}</span><span id="foe" class="fighter">${monsters[s.land]}</span></div><div class="hud">Your health: ${s.hp}/${s.max} · Guardian: ${battle.hp}/${battle.max} shields</div><meter min="0" max="${battle.max}" value="${battle.hp}"></meter><h3>${esc(q[0])}</h3><div class="choices">${answers.map(a=>`<button data-correct="${a.ok}" onclick="answer(${a.ok})">${esc(a.t)}</button>`).join('')}</div><div id="feedback" role="status">A correct answer breaks one shield. A wrong answer costs 25 health.</div><button id="hint" onclick="hint()" ${s.potions?'':'disabled'}>Hint potion (${s.potions})</button> <button id="retreat" onclick="retreat()">Retreat to camp</button>`)}
function hint(){if(locked||!s.potions)return;s.potions--;Array.from(document.querySelectorAll('[data-correct="false"]')).slice(0,2).forEach(b=>b.disabled=true);$('hint').disabled=true;$('feedback').textContent='Two incorrect choices removed.';update()}
function answer(ok){if(locked)return;locked=true;s.attempts[s.land]++;battle.turn++;document.querySelectorAll('#content button').forEach(b=>b.disabled=true);if(ok){battle.hp--;s.correct[s.land]++;s.xp+=s.hero==='🏹'?50:40;$('player').classList.add('strike');$('foe').classList.add('hurt');document.querySelector('.stage').insertAdjacentHTML('beforeend','<span class="burst">✦</span>')}else{s.hp=Math.max(0,s.hp-25);$('player').classList.add('hurt')}$('feedback').innerHTML=`<b>${ok?'Direct hit! One shield broken.':'Enemy counterattack! −25 health.'}</b><br>Correct answer: ${esc(battle.q[1])}<br>${L[s.land].k}`;update();const btn=document.createElement('button');btn.className='primary';btn.textContent=battle.hp===0?'Claim the relic':s.hp===0?'Recover at camp':'Next turn';btn.onclick=()=>{if(battle.hp===0){s.done.push(s.land);s.xp+=100;s.hp=s.max;update();battle=null;open(`<h2>${relics[s.land]} Relic recovered!</h2><p>${names[s.land]} is defeated. +100 XP and full health. The gate is now open.</p><p>${L[s.land].k}</p><button class="primary" onclick="closeModal()">Return to the world</button>`)}else if(s.hp===0){s.faints++;retreat();tell('You fainted. Camp restored your health; the guardian’s shields have reset. Review the Keeper’s scroll and try again.')}else question()};$('feedback').after(btn)}
function retreat(){battle=null;s.hp=s.max;s.x=2;s.y=6;closeModal();update();tell('Back at camp. Health restored; unfinished battles reset. Your answers remain in the report.')}
function rest(){if(modal.open)return;retreat()}
function help(){open('<h2>Your field guide</h2><p><b>Move:</b> arrow keys, WASD, or the direction buttons. <b>Interact:</b> E, Space, or Interact while beside an object.</p><ol><li>Find the Keeper and read the scroll.</li><li>Explore for an optional treasure chest.</li><li>Approach the guardian. Answer correctly to break its shields.</li><li>Collect the relic, then walk to the gate to enter the next land.</li></ol><p>Wrong answers cost 25 health. Camp restores health for free, but resets an unfinished battle. Regular guardians take 3 hits; bosses take 4. Hints remove two wrong answers. XP is a game reward, not a grade.</p><p>Progress saves on this browser when available. A shared computer holds only one adventure. Download your report before starting another.</p><button class="primary" onclick="closeModal()">Explore</button>')}
function journal(){open('<h2>Quest journal</h2>'+L.map((l,i)=>`<p>${s.done.includes(i)?relics[i]:'◇'} <b>${l.n}</b> — ${l.t}${i===s.land?' ← You are here':''}</p>`).join('')+'<button onclick="closeModal()">Back</button>')}
function reportText(){return `QUEST OF THE DATA REALM\nStudent: ${s.name}\nStatus: ${s.done.length===10?'Completed':'In progress'}\nRelics: ${s.done.length}/10\nXP: ${s.xp} (game reward, not a grade)\nFaints: ${s.faints}\nDate: ${new Date().toLocaleString()}\n\n`+L.map((l,i)=>`${i+1}. ${l.t}: ${s.correct[i]} correct / ${s.attempts[i]} answers; ${s.done.includes(i)?'relic recovered':'incomplete'}`).join('\n')+'\n\nResults are saved locally and are not tamper-proof.'}
function report(){open(`<div class="eyebrow">ADVENTURE REPORT</div><h2>${s.done.length===10?'The Data Realm is restored!':'Your journey so far'}</h2><p><b>${esc(s.name)}</b> · ${s.done.length}/10 relics · ${s.xp} XP · ${s.faints} faints</p><table><tr><th>Topic</th><th>Correct / answers</th><th>Relic</th></tr>${L.map((l,i)=>`<tr><td>${l.t}</td><td>${s.correct[i]} / ${s.attempts[i]}</td><td>${s.done.includes(i)?'Recovered':'—'}</td></tr>`).join('')}</table><p>XP is a game reward, not a grade. Local results are not tamper-proof.</p><button class="primary" onclick="download()">Download report</button> <button onclick="window.print()">Print / Save PDF</button> <button onclick="closeModal()">Back to world</button>`)}
function download(){const url=URL.createObjectURL(new Blob([reportText()],{type:'text/plain'})),a=document.createElement('a');a.href=url;a.download='Data_Realm_Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
modal.addEventListener('cancel',e=>{e.preventDefault();if(battle||!s.name)return;closeModal()});document.addEventListener('keydown',e=>{if(modal.open)return;const k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(dirs[k]){e.preventDefault();move(...dirs[k])}else if(k==='e'||k===' '){e.preventDefault();interact()}});
s=fresh();try{const old=JSON.parse(localStorage.getItem(key));if(old&&old.name&&Number.isInteger(old.land)&&old.land>=0&&old.land<10&&Array.isArray(old.attempts))s=old}catch{}update();if(!s.name)intro();else tell('Welcome back! Your adventure has been restored.');
</script></html>
