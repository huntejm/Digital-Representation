<title>Quest of the Data Realm</title>
<style>
:root{--bg:#f1f3fb;--card:#fff;--tx:#1d2433;--mu:#5b6578;--ac:#4a3fd6;--ok:#17803f;--bad:#c23b3b;--bd:#d6dbea;--s1:#bfe3ff;--s2:#fff1c9;--gr:#7ec27a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1f33;--tx:#e8ecf8;--mu:#a0aac4;--ac:#9c93ff;--ok:#4cc17f;--bad:#ff7b7b;--bd:#323a58;--s1:#1b2a5a;--s2:#4a3a6a;--gr:#2f6b3f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1f33;--tx:#e8ecf8;--mu:#a0aac4;--ac:#9c93ff;--ok:#4cc17f;--bad:#ff7b7b;--bd:#323a58;--s1:#1b2a5a;--s2:#4a3a6a;--gr:#2f6b3f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:14px}
h1{font-size:1.7rem;margin:.1em 0}h2{font-size:1.3rem;margin:.2em 0}h3{margin:.3em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:12px 0;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu);gap:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#e8a33d);transition:width .6s}
.tag{font-size:.8rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.place{font-size:1.1rem;font-weight:700}
.art{background:var(--bg);border-radius:12px;padding:6px;margin:10px 0}.art svg{width:100%;height:auto;max-height:230px}
svg text{fill:var(--tx);font:11px system-ui,sans-serif;text-anchor:middle}svg .e{font-size:26px}svg .big{font:700 14px system-ui}
svg .b{fill:var(--card);stroke:var(--ac);stroke-width:2}svg .f{fill:var(--ac);fill-opacity:.35;stroke:var(--ac)}svg .l{stroke:var(--ac);stroke-width:2}
svg .a{stroke:var(--ac);stroke-width:2.5;stroke-dasharray:6 4;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-20}}
svg .sp{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.key{background:var(--bg);border-left:4px solid #e8a33d;padding:10px 12px;border-radius:8px;margin-top:8px}
.scene{position:relative;height:190px;border-radius:14px;overflow:hidden;background:linear-gradient(var(--s1),var(--s2));border:1px solid var(--bd)}
.scene:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--gr)}
.hero,.npc{position:absolute;bottom:26px;font-size:50px;z-index:2}
.hero{left:-60px;animation:walk 1.4s ease-out forwards}@keyframes walk{to{left:12px}}
.npc{right:14px;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.bubble{position:absolute;left:12px;right:84px;top:10px;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:8px 12px;font-size:.98rem;line-height:1.4;min-height:58px;z-index:3}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px;text-align:left;width:100%;margin:6px 0;transition:.15s}
button:hover:not(:disabled){border-color:var(--ac);transform:translateX(4px)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;width:auto;padding:12px 24px;font-weight:700}
button.p:disabled{opacity:.4;cursor:not-allowed}
.opt{animation:in .4s backwards}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ok{color:var(--ok)}.no{color:var(--bad)}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:.92em}
input{font:inherit;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);width:100%;max-width:360px}
.cert{border:7px double var(--ac);text-align:center;padding:26px 14px}
.nm{font-size:2rem;font-weight:800;border-bottom:2px solid var(--ac);display:inline-block;padding:0 14px;margin:6px 0;word-break:break-word}
.rate{font-size:2.2rem;font-weight:800;color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{border-bottom:1px solid var(--bd);padding:5px;text-align:left}.sc{overflow-x:auto}
.cf{position:fixed;top:-30px;font-size:26px;z-index:9;pointer-events:none;animation:fall 2.2s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
.hud{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:.9rem;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
.map{display:flex;justify-content:space-between;margin:10px 0 4px;font-size:1.25rem}.map span{width:10%;text-align:center;opacity:.45}.map .dn{opacity:1}.map .cur{opacity:1;display:inline-block;animation:bob 1.6s ease-in-out infinite}
.hero span,.npc span{display:inline-block}.hpb{position:absolute;right:14px;bottom:86px;width:56px;height:8px;background:var(--bd);border-radius:4px;z-index:3;overflow:hidden}.hpb i{display:block;height:100%;background:var(--bad);transition:width .4s}
@keyframes lunge{50%{transform:translateX(150px) scale(1.2)}}@keyframes dead{to{transform:translateY(40px) rotate(90deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero{left:12px}}
@media print{.np{display:none}body{background:#fff}}

<script>
const S=x=>`<svg viewBox="0 0 320 160" role="img">${x}</svg>`;
const box=(x,y,w,h,t,s)=>`<rect class="b" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text x="${x+w/2}" y="${y+22}" class="big">${t}</text>`+(s||[]).map((q,i)=>`<text x="${x+w/2}" y="${y+40+i*15}">${q}</text>`).join("");
const tree=(n)=>n.map(([t,x,y,p])=>(p>=0?`<path class="l" fill="none" d="M${n[p][1]+10} ${n[p][2]+20}V${y+10}H${x}"/>`:"")+`<rect class="b" x="${x}" y="${y}" width="76" height="20" rx="5"/><text x="${x+38}" y="${y+14}">${t}</text>`).join("");
const IMG=[
S(box(2,35,66,60,"🧠 CPU",["works on","data"])+`<line class="a" x1="68" y1="65" x2="100" y2="65"/>`+box(100,20,104,92,"⚡ RAM",["fast &amp; small","erased when","power is off"])+`<line class="a" x1="204" y1="65" x2="230" y2="65"/>`+box(230,20,88,92,"🗄 Storage",["slower, huge","KEPT when","power is off"])+`<text x="160" y="140">Save = copy from RAM → storage</text>`),
S(`<rect class="b" x="20" y="12" width="280" height="46" rx="6"/>`+[0,1,2,3].map(i=>`<rect class="f" x="${45+i*60}" y="22" width="40" height="26" rx="3"/>`).join("")+`<text x="160" y="74">8 GB RAM stick</text><rect class="b" x="20" y="90" width="280" height="26" rx="4"/><rect class="f" x="20" y="90" width="100" height="26"/><rect class="f" x="120" y="90" width="80" height="26"/><rect class="f" x="200" y="90" width="70" height="26"/><text x="70" y="107">Browser</text><text x="160" y="107">Game</text><text x="235" y="107">Music</text><text x="285" y="107">free</text><text x="160" y="140">RAM almost full → computer slows down</text>`),
S(`<text x="160" y="16" class="big">Every byte has its own address</text>`+[72,105,33,0,255,12,7,64].map((v,i)=>`<text x="${37+i*35}" y="38">${i}</text><rect class="b" x="${20+i*35}" y="46" width="34" height="32" rx="4"/><text x="${37+i*35}" y="67">${v}</text>`).join("")+`<text x="160" y="100">address 0, 1, 2 … like house numbers on a street</text><text x="160" y="125">CPU: “Give me the byte at address 5” → 12</text>`),
S([1,2,3,4,5,6,7,8].map(i=>{const v=2**i,h=v/256*95,x=18+(i-1)*37;return `<rect class="f" x="${x}" y="${115-h}" width="30" height="${h}"/><text x="${x+15}" y="${111-h}" style="font-size:10px">${v}</text><text x="${x+15}" y="130">${i} bit${i>1?"s":""}</text>`}).join("")+`<text x="160" y="150" class="big">Each extra bit DOUBLES the addresses (2ⁿ)</text>`),
S(`<g class="sp" style="transform-origin:100px 80px">${[68,50,32].map(r=>`<circle class="b" cx="100" cy="80" r="${r}" style="fill:none"/>`).join("")}<circle class="f" cx="100" cy="80" r="9"/><line class="l" x1="100" y1="80" x2="100" y2="14"/></g><line class="l" x1="290" y1="22" x2="140" y2="62" style="stroke-width:5"/><circle class="f" cx="140" cy="62" r="6"/><text x="235" y="100">arm + read/write head</text><text x="235" y="120">platter spins (tracks)</text><text x="235" y="140">magnetic · moving parts</text>`),
S([0,1,2].map(i=>[0,1].map(j=>`<rect class="f" x="${20+i*62}" y="${25+j*52}" width="50" height="40" rx="4"/><text x="${45+i*62}" y="${50+j*52}">flash</text>`).join("")).join("")+`<text x="268" y="55" class="e">⚡</text><text x="268" y="85" class="big">No moving</text><text x="268" y="102" class="big">parts!</text><text x="268" y="125">fast · quiet</text>`),
S(tree([["C:\\ (root)",8,6,-1],["Users",28,32,0],["Sam",48,58,1],["Docs",68,84,2],["Pictures",68,110,2],["essay.docx",190,84,3]])+`<text x="250" y="130" style="font-size:10px">path = C:\\Users\\Sam\\Docs\\essay.docx</text>`),
S(box(95,6,130,46,"🖥 File server",[])+`<text x="160" y="68" style="font-size:10px">\\\\SERVER\\Classes\\Period3</text>`+[55,160,265].map(x=>`<line class="a" x1="160" y1="74" x2="${x}" y2="104"/><text x="${x}" y="128" class="e">💻</text>`).join("")+`<text x="160" y="152">Many users share one server’s folders</text>`),
S([0,1,2,3].map(i=>{const wt=50+i*55,wb=wt+55,yt=8+i*34;return `<polygon class="${i%2?"b":"f"}" points="${160-wt/2},${yt} ${160+wt/2},${yt} ${160+wb/2},${yt+32} ${160-wb/2},${yt+32}"/><text x="160" y="${yt+21}" class="big">${["Cache","RAM","SSD","HDD"][i]}</text>`}).join("")+`<text x="160" y="152">Top = fastest &amp; smallest · Bottom = slowest &amp; biggest</text>`),
S(`<text x="60" y="55" class="e">📄📄📄</text><text x="60" y="85" class="big">3 copies</text><text x="160" y="55" class="e">💽💾</text><text x="160" y="85" class="big">2 media types</text><text x="260" y="55" class="e">☁️</text><text x="260" y="85" class="big">1 off-site</text><line class="a" x1="200" y1="105" x2="260" y2="105"/><text x="160" y="135">The 3-2-1 backup rule</text>`)
];
// q: [scenario, correct, wrong, wrong, wrong]
const L=[
{n:"Forgetful Forest",e:"🧚",t:"Memory vs. Storage",k:"RAM is fast but forgets without power (volatile). Storage is slower but keeps data (non-volatile).",
l:"<p>Every computer keeps data in two different places. <b>Memory (RAM)</b> is the CPU’s short-term workspace. It is extremely fast, but it is <b>volatile</b>: the moment power is lost, everything in it disappears.</p><p><b>Storage</b> (a hard drive or SSD) is <b>non-volatile</b>: it keeps files for years, even when unplugged, but it is slower. When you open a program, the computer <b>copies it from storage into RAM</b>. When you press <b>Save</b>, it copies your work from RAM back into storage. Unsaved work lives only in RAM!</p>",
q:[["The forest guard asks: which part forgets everything when the castle power goes out?","RAM","SSD","Hard drive","USB flash drive"],["You saved your map file. After a blackout you reopen it. Why is it still there?","Storage is non-volatile and keeps data without power","RAM kept a copy","The CPU memorized it","The monitor stored it"],["A fairy says: “Which job belongs to RAM?”","Holding programs and data being used right now","Keeping photos for years","Backing up the school","Connecting to Wi-Fi"],["You typed a report but have not saved. What will pressing Save do?","Copy the data from RAM to storage","Move the CPU to the drive","Erase the RAM","Turn the report into hardware"],["Desk and filing cabinet: RAM is the desk. Storage is the…","Filing cabinet","Light switch","Calculator","Printer"]]},
{n:"Desk Tower",e:"🧙",t:"How RAM Is Used",k:"Programs run from RAM. More RAM = more things open at once. Drive size decides how much you can save.",
l:"<p>RAM is made of fast electronic chips on a stick plugged into the motherboard. It is measured in <b>gigabytes (GB)</b>; modern computers often have 8 to 32 GB. Everything you are running right now (the browser, a game, music) is holding space in RAM.</p><p>If RAM fills up, the computer has to shuffle data back and forth with the drive, and everything slows. More RAM helps with <b>multitasking</b>. RAM does <b>not</b> change how many files you can save; that is the drive’s job.</p>",
q:[["The wizard’s PC has 4 GB RAM and crawls with 40 tabs open. Best free fix?","Close tabs and programs not in use","Delete photos from the drive","Turn the brightness down","Rename the files"],["When you launch a game, data is copied from where to where?","Storage into RAM","RAM into storage","Monitor into RAM","Keyboard into the drive"],["Which upgrade most helps running many programs at once?","More RAM","A bigger monitor","A new mouse","A longer cable"],["PC: 16 GB RAM, 512 GB drive. You want to store 200 GB of video. Which number matters?","The 512 GB drive","The 16 GB RAM","They are added together","Neither"],["Why is RAM so much faster than a hard drive?","Electronic chips built for instant access to active data","It is physically bigger","It is magnetic","It is far from the CPU"]]},
{n:"Address Alley",e:"📮",t:"Memory Addresses",k:"Memory is a long row of bytes. Each byte has a unique address (starting at 0) so the CPU can find it.",
l:"<p>Memory is a long row of tiny boxes called <b>bytes</b>. To find one, the CPU needs a number, just like a mail carrier needs a house number. That number is the byte’s <b>address</b>. The first byte is address <b>0</b>, the next is 1, then 2, and so on.</p><p>The CPU sends the address along the <b>address bus</b> and memory sends back the data stored there. Programmers and technicians often write addresses in <b>hexadecimal</b> (base 16), like <code>0x1F</code>. If two programs write to the same address, the later one <b>overwrites</b> the earlier one’s data.</p>",
q:[["The mail carrier asks: what is a memory address?","A unique number that identifies one byte’s location","A website link","The name of a file","The brand of the RAM"],["The CPU needs the data stored at address 5. Why does it use addresses?","To find exactly where the data is","To change the screen color","To charge the battery","To name the user"],["Memory addresses normally begin at which number?","0","1","100","-1"],["Two programs write to address 0x2000. What happens?","The later write overwrites the earlier data","Both are stored together","RAM grows bigger","Nothing"],["What number system is 0x1F written in?","Hexadecimal","Binary only","Roman numerals","Decimal only"]]},
{n:"Doubling Bridge",e:"🧌",t:"Counting Addresses",k:"n address bits give 2ⁿ addresses. Each added bit doubles the total. 32 bits ≈ 4 GB.",
l:"<p>How many addresses can a computer use? It depends on how many <b>bits</b> (0s and 1s) make up an address. With <b>n</b> bits you get <b>2ⁿ</b> different addresses. 1 bit gives 2, 2 bits give 4, 3 bits give 8, and so on. <b>Every extra bit doubles the total.</b></p><p>8 bits gives 256 addresses. A <b>32-bit</b> system has 2³² addresses, about 4.29 billion, which equals <b>4 GB</b> of memory. That is why old 32-bit computers could not use more than about 4 GB, even if more was installed. <b>64-bit</b> systems can address vastly more.</p>",
q:[["The troll asks: how many addresses can 3 address bits make?","8","3","6","9"],["How many addresses can 8 bits make?","256","64","8","128"],["An old 32-bit PC has 8 GB RAM installed. About how much can it use?","4 GB","8 GB","16 GB","1 TB"],["You add one more address bit. What happens to the number of addresses?","It doubles","It goes up by one","It is cut in half","It stays the same"],["A tiny chip has 10 address lines. How many memory locations can it reach?","1,024","100","10","10,000"]]},
{n:"Spinning Spire",e:"🌀",t:"Hard Disk Drives",k:"HDDs store data magnetically on spinning platters. Big and cheap, but slower and fragile.",
l:"<p>A <b>hard disk drive (HDD)</b> stores data magnetically on one or more spinning metal <b>platters</b>. A <b>read/write head</b> on a moving arm floats just above the surface. Each platter is divided into circular <b>tracks</b>, which are split into <b>sectors</b>, so every piece of data has a spot.</p><p>Because HDDs have <b>moving parts</b>, they are slower than SSDs and can be damaged by drops. They are, however, cheap per terabyte, which makes them great for big archives. When a file is saved in scattered pieces (<b>fragmentation</b>), the head must jump around to collect it, slowing the drive. <b>Defragmenting</b> puts the pieces back together.</p>",
q:[["The spire keeper asks: which part of an HDD actually holds the data?","Magnetic spinning platters","Flash chips","The fan","The power cord"],["Why is an HDD more easily damaged by a drop than an SSD?","It has moving parts like the arm and platters","It is heavier","It uses RAM","It has more memory"],["A school must archive 30 TB cheaply and rarely opens the files. Best choice?","HDDs","RAM sticks","CPU cache","An SSD for every PC"],["What is fragmentation?","Pieces of one file scattered across the platter","Cracks in the case","Corrupted RAM","Lost Wi-Fi packets"],["Tracks and sectors are used to…","Organize where data sits on the platter","Cool the drive","Connect to Wi-Fi","Display video"]]},
{n:"Flash Fortress",e:"⚡",t:"Solid State Drives",k:"SSDs use flash chips with no moving parts: fast, quiet, durable. Never defragment them.",
l:"<p>A <b>solid state drive (SSD)</b> stores data in <b>flash memory</b> chips (NAND). With <b>no moving parts</b> it is far faster, silent, and more shock resistant than an HDD, which is why laptops boot in seconds with one. The trade-off is a higher price per gigabyte.</p><p>Flash cells survive a limited number of writes, so the drive spreads writes around (<b>wear leveling</b>) and uses <b>TRIM</b> to tidy unused blocks. Because an SSD has no head to move, fragmentation does not slow it, so <b>you should not defragment an SSD</b>: it only adds wear.</p>",
q:[["The fortress captain asks: why is an SSD faster than an HDD?","No moving parts; flash is read electronically","It spins faster","It uses more power","It has bigger platters"],["A technician wants to defragment your SSD weekly. Best reply?","No, it gains nothing and adds wear","Yes, every day","Yes, it spins","Only on Fridays"],["A laptop rides in a backpack all day. Why choose an SSD?","No moving parts, so bumps are less risky","It never needs power","It uses RAM","It is always cheaper"],["What does wear leveling do?","Spreads writes evenly across flash cells","Makes the SSD spin evenly","Deletes old files","Boosts the CPU"],["Which is generally more expensive per gigabyte?","SSD","HDD","They cost the same","Paper"]]},
{n:"Folder Grove",e:"🌳",t:"File Systems & Directories",k:"A file system tracks files in a tree of folders. A path lists drive, folders, then the file.",
l:"<p>A drive is just billions of bytes until a <b>file system</b> (such as NTFS, APFS, or ext4) organizes them. It keeps track of where each file sits and what it is called. Files are organized into <b>directories</b> (folders), forming an upside-down <b>tree</b> that starts at the <b>root</b>, like <code>C:\\</code>.</p><p>A <b>path</b> is the address of a file: <code>C:\\Users\\Sam\\Docs\\essay.docx</code> lists the drive, each folder, and finally the file. A <b>relative path</b> starts from where you are; <code>..</code> means “go up one folder.” The same file name can exist in different folders.</p>",
q:[["The tree sprite asks: in C:\\Users\\Sam\\Docs\\essay.docx, which is the file?","essay.docx","Docs","Users","C:"],["What does a file system do?","Tracks where files are stored and organizes them into folders","Speeds up the CPU","Draws the graphics","Charges the battery"],["Which is the root of the tree?","The top-level directory, such as C:\\","essay.docx","Docs","Sam"],["You are in C:\\Users\\Sam\\Docs. The path ..\\Pictures goes to…","C:\\Users\\Sam\\Pictures","C:\\Users\\Sam\\Docs\\Pictures","C:\\Pictures","C:\\Users\\Pictures\\Docs"],["Two different files are both named notes.txt. When can this be true?","They are in different folders","Never","Only if both are open","Only with lots of RAM"]]},
{n:"Network Harbor",e:"⚓",t:"Network Directories",k:"A file server shares folders over the network. Permissions control who can read or change files.",
l:"<p>In a school, files are often kept on a <b>file server</b>, a computer whose job is to store shared files. Users reach a <b>shared folder</b> through a <b>network path</b> such as <code>\\\\SERVER\\Classes\\Period3</code>. It can be <b>mapped</b> to a drive letter like <code>S:</code> so it looks like a local drive.</p><p><b>Permissions</b> decide who can do what: <b>read-only</b> (view), <b>write/modify</b> (change), or <b>full control</b>. Servers make backups easy and let you log in from any computer, but if you are off the network (or the server is down), you cannot reach those files.</p>",
q:[["The harbor master asks: what does a file server do?","Stores shared files for many users","Prints posters","Cools the lab","Plays music"],["\\\\SERVER\\Classes\\Period3 is an example of…","A network path to a shared folder","A website address","An email address","A RAM address"],["Students must view a worksheet but never change it. Which permission?","Read-only","Full control","Modify","Delete"],["What does mapping a share to S: do?","Gives the network folder a drive letter","Copies the server to your PC","Deletes the folder","Makes it faster than RAM"],["Sam saved to S: at school but can’t open it at home. Why?","It lives on the school server and Sam is off the network","Files vanish at 3 PM","RAM is full","S: only works on SSDs"]]},
{n:"Layer Mountain",e:"🏔️",t:"Virtual Memory & Cache",k:"Memory is layered: cache → RAM → SSD/HDD. Faster layers are smaller. Virtual memory borrows drive space when RAM is full.",
l:"<p>Computers use a <b>memory hierarchy</b>: <b>CPU cache</b> (tiny, blazing fast, on the CPU), then <b>RAM</b>, then <b>SSD/HDD</b>. The faster a layer is, the smaller and more expensive it is. <b>Cache</b> keeps copies of recently used data so the CPU rarely waits; finding data there is a <b>hit</b>, missing it is a <b>miss</b>.</p><p>When RAM fills up, the OS uses part of the drive as <b>virtual memory</b> (a pagefile or swap space), moving less-used chunks called <b>pages</b> out of RAM. Programs keep running, but much slower, because drives are far slower than RAM. Constant drive activity with RAM at 100% is a classic sign.</p>",
q:[["The mountain guide asks: which order is fastest to slowest?","Cache, RAM, SSD, HDD","HDD, SSD, RAM, cache","RAM, cache, HDD, SSD","SSD, cache, RAM, HDD"],["RAM is full, so the OS borrows drive space to act like extra memory. This is called…","Virtual memory","Cache","ROM","A register"],["A PC lags, drive light flickers constantly, RAM at 100%. Most likely cause?","Heavy use of virtual memory (paging)","Too much cache","A dead monitor","A loose network cable"],["The CPU finds the data it needs in cache. This is a…","Cache hit","Cache miss","Crash","Reboot"],["Why not make ALL memory fast cache?","Fast memory is small and costly","Cache can’t store data","Nobody has invented it","It is illegal"]]},
{n:"Vault of Backups",e:"🏰",t:"Capstone: Protect the Data",k:"RAID is not a backup. Use the 3-2-1 rule: 3 copies, 2 media types, 1 off-site.",
l:"<p>Drives fail, get stolen, and people delete things by mistake. A <b>backup</b> is a separate copy you can restore from. The <b>3-2-1 rule</b>: keep <b>3</b> copies of your data, on <b>2</b> different kinds of media, with <b>1</b> copy <b>off-site</b> (such as cloud storage), so a fire or flood cannot destroy every copy.</p><p><b>RAID 1</b> mirrors two drives so one can fail without losing data, but it is <b>not a backup</b>: delete a file and it is deleted from both. A smart system combines everything you learned: SSD for speed, enough RAM, a permissioned file server for sharing, and 3-2-1 backups.</p>",
q:[["The vault keeper: a class stores projects on RAID 1 mirrored drives and a student deletes one. Does RAID help?","No, the deletion is mirrored; a real backup is needed","Yes, RAID restores it","Yes, through RAM","Yes, by defragmenting"],["What does the 3-2-1 rule mean?","3 copies, 2 media types, 1 off-site","3 drives, 2 PCs, 1 user","3 GB, 2 GB, 1 GB","3 passwords, 2 users, 1 admin"],["Which is the best plan for a school lab?","SSD PCs, 16 GB RAM, permissioned file server, nightly + cloud backup","One HDD, 2 GB RAM, no backups","Only RAM, since it is fastest","Full control for everyone, no backups"],["A fire destroys the server room. Which backup survives?","The off-site cloud copy","A copy on the same server","RAM contents","A mirror in the same room"],["A video won’t play smoothly: 4 GB RAM, fast CPU, SSD 80% full. Best first upgrade?","More RAM","A faster monitor","A new keyboard","More USB ports"]]}
];
const app=document.getElementById("app"),$=h=>{app.innerHTML=h;window.scrollTo(0,0)};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const MON=["👻","🐌","👺","🧌","🐉","🤖","🕷️","🦑","🗿","👾"],MN=["Forgetful Ghost","Lag Slug","Address Goblin","Bridge Troll","HDD Dragon","Flash Golem","Path Spider","Network Kraken","Cache Titan","The Data Destroyer"];
const RE=["🔮","🧠","🧭","🗝️","💿","⚡","🌳","⚓","👑","🛡️"],RN=["Memory Crystal","RAM Rune","Address Compass","Binary Key","Platter Shield","Flash Blade","Root Key","Network Anchor","Cache Crown","Backup Aegis"];
const CS=[["🛡️","Knight","Tough: starts with 4 hearts"],["🧙","Wizard","Wise: starts with 3 hint potions"],["🏹","Ranger","Quick learner: +25% XP on every hit"]];
const boss=l=>l==4||l==9,T=()=>["Novice Courier","Byte Knight","Data Paladin","Archmage of Memory"][lv<3?0:lv<6?1:lv<9?2:3];
let lv=0,att=0,wr=0,log=[],name="",order=[],t0=0,tm,cls=0,hero="🦸",hp=3,mx=3,pot=1,xp=0,mh=1,mmx=1,deaths=0;
const clsHtml=()=>CS.map((c,i)=>`<button style="${i==cls?"border-color:var(--ac);background:var(--bg)":""}" onclick="cls=${i};document.getElementById('cl').innerHTML=clsHtml()">${c[0]} <b>${c[1]}</b>: ${c[2]}</button>`).join("");
function start(){$(`<div class="card"><h1>🗡️ Quest of the Data Realm</h1>
<p>The Data Realm is under attack! Monsters born from forgotten files, slow drives and lost backups guard ten lands. You are a <b>Data Courier</b>. In each land, study the ancient scroll, then fight the monster with <b>knowledge</b>: a right answer strikes it, a wrong answer costs you a ❤️. Collect relics, earn XP, defeat the two bosses, and restore the Vault.</p>
<p><label><b>Hero name (appears on your certificate)</b><br><input id="nm" maxlength="40" placeholder="First and last name" autocomplete="name" oninput="document.getElementById('go').disabled=!this.value.trim()"></label></p>
<p><b>Choose your class</b></p><div id="cl">${clsHtml()}</div>
<p><button id="go" class="p" disabled onclick="go()">🗺️ Begin the adventure</button></p></div>`)}
function go(){name=document.getElementById("nm").value.trim();hero=CS[cls][0];mx=hp=cls==0?4:3;pot=cls==1?3:1;xp=0;deaths=0;lv=0;log=[];t0=Date.now();begin()}
function begin(){att=0;wr=0;mh=mmx=boss(lv)?2:1;order=shuf([0,1,2,3,4]);lesson()}
function head(){return `<div class="hud"><b>${hero} ${esc(name)} · ${T()}</b><span>${"❤️".repeat(hp)}${"🖤".repeat(mx-hp)}</span><span>🧪 ${pot}</span><span>⭐ ${xp} XP</span></div><div class="map">${MON.map((m,i)=>`<span class="${i<lv?"dn":i==lv?"cur":""}" title="${MN[i]}">${i<lv?RE[i]:i==lv?hero:m}</span>`).join("")}</div><div class="bar"><i style="width:${lv*10}%"></i></div>`}
function lesson(msg){const d=L[lv];
 $(`${head()}<div class="card"><div class="tag">${lv<3?"Foundations":lv<7?"Intermediate":"Advanced"}</div><div class="place">${d.e} ${d.n}</div><h2>${d.t}</h2>${msg||""}${boss(lv)?`<p class="no"><b>⚠️ BOSS BATTLE:</b> ${MN[lv]} takes 2 correct strikes to defeat!</p>`:`<p class="tag">A wild ${MON[lv]} ${MN[lv]} guards this land.</p>`}<div class="art">${IMG[lv]}</div>${d.l}<div class="key">🔑 <b>Key idea:</b> ${d.k}</div><p><button class="p" onclick="scene()">⚔️ I’m ready: face the monster</button></p></div>`)}
function scene(){const d=L[lv],q=d.q[order[att%5]],o=shuf([[q[1],1],[q[2],0],[q[3],0],[q[4],0]]);
 $(`${head()}<div class="card"><div class="tag">⚔️ Battle at ${d.n} vs ${MN[lv]}</div><div class="scene"><div class="hero"><span id="hs">${hero}</span></div><div class="hpb"><i id="mh" style="width:${mh/mmx*100}%"></i></div><div class="npc"><span id="ns">${MON[lv]}</span></div><div class="bubble" id="bb"></div></div><div id="op"></div></div>`);
 let i=0;const bb=document.getElementById("bb"),txt=q[0];clearInterval(tm);
 const show=()=>{clearInterval(tm);bb.textContent=txt;document.getElementById("op").innerHTML=o.map((x,k)=>`<button class="opt" data-ok="${x[1]}" style="animation-delay:${k*.12}s" onclick="pick(this,${x[1]})"><b>${"ABCD"[k]}.</b> ${esc(x[0])}</button>`).join("")+(pot>0?`<div id="pt"><button onclick="hint()">🧪 Use a hint potion (${pot} left): remove 2 wrong answers</button></div>`:"")};
 bb.onclick=show;setTimeout(()=>{tm=setInterval(()=>{bb.textContent=txt.slice(0,++i);if(i>=txt.length)show()},22)},700)}
function hint(){if(pot<1)return;pot--;shuf([...document.querySelectorAll('#op .opt[data-ok="0"]')]).slice(0,2).forEach(b=>b.remove());document.getElementById("pt").innerHTML="🧪 Two wrong answers vanished!"}
function pick(b,ok){att++;document.querySelectorAll("#op button").forEach(x=>x.disabled=true);const hs=document.getElementById("hs"),ns=document.getElementById("ns");
 if(ok){const g=Math.round((wr?30:60)*(cls==2?1.25:1));xp+=g;hs.style.animation="lunge .5s";setTimeout(()=>ns.style.animation="shk .4s",250);mh--;document.getElementById("mh").style.width=mh/mmx*100+"%";
  if(mh>0){setTimeout(()=>$(`${head()}<div class="card"><h2 class="ok">💥 Direct hit! +${g} XP</h2><p>${MN[lv]} is wounded but still standing. Strike again!</p><p><button class="p" onclick="scene()">⚔️ Next strike</button></p></div>`),900);return}
  setTimeout(()=>ns.style.animation="dead .8s forwards",450);setTimeout(()=>win(g),1300)}
 else{wr++;hp--;b.classList.add("shake");hs.style.animation="shk .5s";
  setTimeout(()=>{if(hp<1){deaths++;hp=mx;mh=mmx;lesson(`<p class="no"><b>💀 You fainted!</b> A kind healer restores your hearts, but ${MN[lv]} has recovered too. Study the scroll again.</p>`)}else lesson(`<p class="no"><b>🚧 Ouch! −1 ❤️.</b> ${MN[lv]} struck back. Re-read the scroll, then face a new challenge on the same topic.</p>`)},700)}}
function win(g){const d=L[lv],l=lv;log.push(att);confetti();if(!wr)pot++;xp+=40;lv++;
 $(`${head()}<div class="card"><h2 class="ok">🎉 ${MN[l]} defeated!</h2><p>+${g+40} XP (includes a 40 XP victory bonus)</p><p>🎁 <b>Relic found:</b> ${RE[l]} ${RN[l]}${wr?"":"<br>🧪 Flawless victory: bonus hint potion!"}</p><div class="key">🔑 ${d.k}</div><p><button class="p" onclick="nxt()">${lv<10?"➡️ Travel to "+L[lv].n:"🏆 Enter the Vault: claim my certificate"}</button></p></div>`)}
function nxt(){if(lv>9)cert();else begin()}
function confetti(){const e=["🎉","⭐","💾","✨","🔑"];for(let i=0;i<26;i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%5];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
function cert(){
 const tot=log.reduce((a,b)=>a+b,0),first=log.filter((x,i)=>x<=(boss(i)?2:1)).length,mins=Math.max(1,Math.round((Date.now()-t0)/60000));
 const r=tot<=14?"Excellent":tot<=18?"Good":tot<=24?"Fair":"Needs Improvement";
 const nt={Excellent:"Outstanding mastery of memory and storage concepts with very few missteps.",Good:"Solid understanding, with a few topics worth reviewing.",Fair:"Basic understanding; review the lands where you needed several tries.","Needs Improvement":"You completed every land, but these topics need more practice."}[r];
 const d=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});confetti();
 $(`<div class="card cert"><div class="tag">Certificate of Completion</div><h1>🏆 Quest of the Data Realm</h1><p>This certifies that</p><div class="nm">${esc(name)}</div><p>${hero} ${CS[cls][1]} · <b>Archmage of Memory</b></p>
 <p>defeated all ten monsters and mastered RAM, memory addresses, hard drives, SSDs, file systems, network directories, virtual memory, and backups.</p><div style="font-size:1.6rem">${RE.join(" ")}</div><div class="rate">${r}</div><p>${nt}</p><p class="tag">${d}</p></div>
 <div class="card"><h3>📊 ${esc(name)}’s results</h3><p>Answers given: <b>${tot}</b> (12 is perfect) · Perfect lands: <b>${first} of 10</b> · Faints: <b>${deaths}</b> · XP: <b>${xp}</b> · Time: <b>about ${mins} min</b></p>
 <div class="sc"><table><tr><th>#</th><th>Topic</th><th>Monster</th><th>Answers</th></tr>${L.map((l,i)=>`<tr><td>${i+1}</td><td>${l.t}</td><td>${MON[i]} ${MN[i]}</td><td>${log[i]}${log[i]<=(boss(i)?2:1)?" ⭐":""}</td></tr>`).join("")}</table></div>
 <p class="tag">Excellent: 12–14 answers · Good: 15–18 · Fair: 19–24 · Needs Improvement: 25+</p>
 <button class="p np" onclick="window.print()">🖨️ Print certificate</button> <button class="np" style="width:auto;display:inline-block" onclick="start()">Play again</button></div>`)}
start();
</script></body></html>
