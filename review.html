<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stormcode | Unit 2 Battle Review</title><meta name="description" content="Drop in, build your knowledge, and outrun the storm. A CS Academy AP CSP Unit 2 review."><style>
:root{--bg:#0a1023;--panel:#131d36;--muted:#a9b8d4;--lime:#d6fb63;--cyan:#6fe3ef;--purple:#a48dff;--line:#2c3853}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f6ff;font:16px/1.5 system-ui,sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button{border:0;border-radius:9px;padding:13px 20px;font-weight:750;background:var(--lime);color:#142126;transition:transform .15s}button:hover{transform:translateY(-2px)}button:disabled{cursor:default;transform:none;opacity:.6}button:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}.secondary{background:#26344e;color:white;border:1px solid #41516f}.quiet{padding:7px 12px;background:transparent;color:var(--muted);border:1px solid var(--line)}header{max-width:1360px;margin:auto;padding:22px 32px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:22px;font-weight:950;letter-spacing:-1px}.brand span{color:var(--lime)}.tag,.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800;color:var(--cyan)}main{max-width:1360px;margin:auto;padding:32px}.hero{display:grid;grid-template-columns:1fr 1.14fr;gap:45px;align-items:center}.hero h1{font-size:clamp(48px,6vw,86px);line-height:.98;letter-spacing:-4px;margin:20px 0}.hero h1 em{font-style:normal;color:var(--lime)}p{color:var(--muted)}.lead{max-width:470px;font-size:18px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.pill{border:1px solid var(--line);border-radius:25px;padding:6px 12px;font-size:12px;color:var(--muted)}.setup{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:26px 0}.setup label{font-size:12px;color:var(--muted);display:grid;gap:7px}select{background:var(--panel);color:white;padding:12px;border:1px solid var(--line);border-radius:8px}.mapbox{position:relative;background:radial-gradient(ellipse at 50% 40%,#194252,#142035 70%);border:1px solid #42516c;border-radius:20px;overflow:hidden;min-height:430px}.mapbox svg{display:block;width:100%;height:auto}.maptitle{position:absolute;top:20px;left:22px}.maptitle b{display:block;font-size:13px}.maptitle small{color:var(--muted);font-size:11px}.maplegend{position:absolute;bottom:18px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px}.maplegend span:last-child{color:var(--lime)}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:35px 0}.feature{border-top:1px solid var(--line);padding-top:18px}.feature b{font-size:14px}.feature p{font-size:13px;margin-top:6px}footer{color:#7d8fac;font-size:11px;border-top:1px solid var(--line);padding:20px 0}.layout{display:grid;grid-template-columns:280px 1fr;gap:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.stat b{font-size:24px}.bar{height:7px;background:#2a3651;border-radius:9px;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--lime);transition:width .3s}.shield i{background:var(--cyan)}.question h2{font-size:23px;line-height:1.35;margin:14px 0 22px}pre{font:15px/1.6 ui-monospace,Consolas,monospace;background:#090f21;border:1px solid #2d3b58;padding:20px;border-radius:10px;overflow:auto;color:#ccecf3;white-space:pre}.answers{display:grid;gap:10px}.answer{background:#1c2944;border:1px solid #3a4b6c;color:#e9efff;text-align:left;display:flex;gap:14px;align-items:center;font-weight:500}.answer .letter{background:#2f405e;padding:3px 9px;border-radius:5px;font-size:12px}.answer.correct{border-color:var(--lime);background:#233c33}.answer.wrong{border-color:#fa8a99;background:#422c40}.feedback{margin-top:22px;padding:18px;border-radius:9px;background:#0a1527;border-left:3px solid var(--cyan)}.feedback strong{display:block}.feedback p{margin:7px 0 15px}.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:var(--muted);font-size:12px}.zonebtn{display:block;width:100%;margin:10px 0;text-align:left;background:#1b2c43;color:white;border:1px solid #39516b;padding:18px}.zonebtn small{display:block;color:var(--cyan);font-weight:400}.zonebtn:hover{border-color:var(--lime)}.hidden{display:none!important}.result{max-width:850px;margin:auto}.result h1{font-size:48px;letter-spacing:-2px;line-height:1.1}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.reviewitem{border-top:1px solid var(--line);padding:18px 0}.reviewitem p{margin:7px 0}.help{max-width:850px;margin:auto}.help h2{margin-top:28px}.small{font-size:12px;color:var(--muted)}.inventory{margin-top:22px;font-size:13px}.inventory button{margin:6px 0;width:100%}.statusline{min-height:48px;font-size:12px;color:var(--cyan)}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}@media(max-width:850px){.hero{grid-template-columns:1fr;gap:20px}.hero h1{letter-spacing:-2px}.mapbox{min-height:0}.layout{grid-template-columns:1fr}.layout aside{display:grid;grid-template-columns:1fr 1fr;gap:15px}.inventory{margin-top:0}.stats{grid-template-columns:repeat(2,1fr)}main{padding:22px 16px}header{padding:18px 16px}.tag{display:none}.features{gap:12px}pre{font-size:12px}.question h2{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="brand">◈ STORM<span>CODE</span></div><div class="tag">AP CSP / SECOND EDITION / UNIT 02</div><button class="quiet" id="helpBtn">Field guide</button></header><main id="app"></main><script>
'use strict';
const Q=[];
function q(topic,prompt,code,answers,correct,explanation){Q.push({id:Q.length+1,topic,prompt,code,answers,correct,explanation});}
q('Functions','Which names are parameters?','def drawSupply(x, y, color):\n    Circle(x, y, 12, fill=color)\n\ndrawSupply(80, 120, \'gold\')',['x, y, color','80, 120, gold','Circle and drawSupply','Only color'],0,'Parameters are the input names in a function definition. The values supplied in the call are arguments.');
q('Functions','Which is the correct call for a blue circle centered at (100, 250)?','def marker(x, y, color):\n    Circle(x, y, 15, fill=color)',['marker(250, 100, \'blue\')','marker(100, 250, \'blue\')','marker(\'blue\', 100, 250)','def marker(100, 250, \'blue\'):'],1,'Arguments match parameters by position: x=100, y=250, color=blue.');
q('Functions','How many circles are created when this code runs?','def loot(x):\n    Circle(x, 100, 10)\n    Circle(x, 130, 10)\n\nloot(50)\nloot(200)',['0','2','3','4'],3,'Defining the function creates no circles. Each of two calls runs both Circle statements, for four circles.');
q('Functions','Why does no supply marker appear?','def supply():\n    Circle(200, 200, 20, fill=\'gold\')',['The radius must be 200.','The function has not been called.','Functions must have parameters.','Circle cannot be inside a function.'],1,'A custom function body runs when you call it. Add supply() after the definition.');
q('Functions','Which change best supports drawing the same tower in many locations?','',['Copy and paste every shape 20 times.','Use only one very large shape.','Define a tower function with position parameters.','Remove all function calls.'],2,'A reusable function groups the tower instructions; position parameters let each call draw it somewhere different.');
q('Functions','What is wrong with the final line?','def drop(x, y):\n    Circle(x, y, 10)\n\ndrop(100)',['The call is missing the y argument.','The function needs a return value.','Circle needs a color.','Nothing; y automatically equals 100.'],0,'The function has two required parameters, so the call needs two arguments, such as drop(100, 200).');
q('Functions','Which statement is true about AP pseudocode procedures and Python functions?','',['Both must draw a shape.','Neither can have inputs.','Both are named groups of instructions that can use parameters.','Both run automatically when defined.'],2,'AP CSP calls a named group of instructions a procedure. Python uses def to define functions.');
q('Functions','Where is the center of the circle created by beacon(60, 90)?','def beacon(x, y):\n    Circle(x + 20, y - 10, 8)',['(80, 80)','(60, 90)','(40, 100)','(90, 60)'],0,'Substitute x=60 and y=90: the center is (60+20, 90-10), or (80, 80).');
q('Mouse events','When does onMouseRelease run?','',['Continuously while the pointer moves.','When a pressed mouse button is released on the canvas.','Only when you call it yourself.','When the program first loads.'],1,'The graphics package calls onMouseRelease when the mouse button is released on the canvas.');
q('Mouse events','A student presses at (70, 90). Where is the marker drawn?','def onMousePress(mouseX, mouseY):\n    Circle(mouseX, mouseY, 10)',['(90, 70)','(0, 0)','(70, 90)','(200, 200)'],2,'mouseX and mouseY receive the coordinates of the press. They are passed to Circle in that order.');
q('Mouse events','What happens after a press followed by a release?','orb = Circle(200, 200, 20, fill=\'blue\')\ndef onMousePress(mouseX, mouseY):\n    orb.fill = \'gold\'\ndef onMouseRelease(mouseX, mouseY):\n    orb.fill = \'purple\'',['The orb ends blue.','The orb ends gold.','The orb ends purple.','The orb disappears.'],2,'The press changes the fill to gold. The later release changes the same orb to purple.');
q('Mouse events','Why does this handler not respond to mouse presses?','def onMousepress(mouseX, mouseY):\n    Circle(mouseX, mouseY, 12)',['The handler name has incorrect capitalization.','The function has too many parameters.','Circles cannot be drawn in handlers.','The coordinates must be named x and y.'],0,'The recognized name is onMousePress, with an uppercase P. Python names are case sensitive.');
q('Mouse events','What is the center of the circle after a press at (90, 220)?','orb = Circle(200, 200, 15)\ndef onMousePress(mouseX, mouseY):\n    orb.centerX = mouseY\n    orb.centerY = mouseX',['(90, 220)','(220, 90)','(200, 200)','(90, 90)'],1,'The assignments deliberately swap the coordinates: centerX becomes 220 and centerY becomes 90.');
q('Mouse events','Which is an example of program input?','',['The code stored in a function body.','A circle drawn by the program.','The location of a user’s mouse press.','The color finally displayed.'],2,'A mouse event supplies data to the program. A displayed circle or color is output.');
q('Mouse events','Which line draws a marker only when the mouse is released?','',['def onMouseRelease(mouseX, mouseY):','def onMouseMove(mouseX, mouseY):','def onMousePress(mouseX, mouseY):','onMouseRelease = True'],0,'Use the exact onMouseRelease handler definition and indent the drawing statements beneath it.');
q('Mouse events','Why do event handlers respond without calls written by the student?','',['All Python functions automatically run.','The graphics package calls the matching handler when the event occurs.','A parameter calls the function.','A shape calls every function.'],1,'Event handlers are registered by their expected names. Custom helper functions still need calls.');
q('Properties & methods','Which statement changes the existing crate’s fill?','crate = Rect(100, 100, 40, 40, fill=\'brown\')',['crate.fill == \'gold\'','crate.color = \'gold\'','crate.fill = \'gold\'','fill.crate = \'gold\''],2,'Assign to the existing shape’s fill property with a single equals sign. == compares values.');
q('Properties & methods','What does setting visible to False do?','crate.visible = False',['Deletes the variable forever.','Makes the crate invisible.','Moves the crate to the back.','Changes the fill to black.'],1,'The shape remains available through its variable, but it is not shown. Setting visible=True shows it again.');
q('Properties & methods','Which call places the crate above overlapping shapes?','',['crate.toFront()','crate.toBack()','crate.visible()','crate.front = True'],0,'toFront() is a method call that changes drawing order so the shape appears on top.');
q('Properties & methods','For a circle with fill=None, the point is inside the boundary but not on the drawn border. Which result is correct?','',['hits=True; contains=True','hits=True; contains=False','hits=False; contains=False','hits=False; contains=True'],3,'contains checks the enclosed area. hits checks drawn parts, so an unfilled interior does not count as a hit.');
q('Properties & methods','Which expression tests whether two shapes touch or overlap?','',['player.contains(loot)','player.hitsShape(loot)','player.toFront(loot)','player.fill == loot'],1,'hitsShape takes another shape and tests contact. contains(x, y) tests a point instead.');
q('Properties & methods','What is the final radius?','orb = Circle(200, 200, 10)\norb.radius = orb.radius + 5\norb.radius = orb.radius + 5',['5','10','15','20'],3,'The radius starts at 10, then increases to 15 and finally to 20.');
q('Properties & methods','Which property controls transparency on a 0–100 scale?','',['rotateAngle','opacity','borderWidth','visible'],1,'Opacity 0 is fully transparent; 100 is fully opaque. visible is a separate Boolean property.');
q('Properties & methods','Which expression checks whether the player entirely surrounds the supply shape?','',['player.containsShape(supply)','player.contains(supply)','supply.toBack(player)','player.hits(mouseX, mouseY)'],0,'containsShape checks whether a shape entirely contains another shape. hitsShape only requires contact.');
q('Conditionals','What is the final fill?','orb.fill = \'blue\'\nx = 100\nif x > 200:\n    orb.fill = \'gold\'\nelse:\n    orb.fill = \'green\'',['blue','gold','green','None'],2,'100 > 200 is False, so the else body sets the fill to green.');
q('Conditionals','What is the final fill?','orb.fill = \'white\'\nx = 250\nif x > 100:\n    orb.fill = \'red\'\nif x > 200:\n    orb.fill = \'blue\'',['white','red','blue','purple'],2,'Both independent conditions are True. Both bodies run; the second assignment sets the final fill to blue.');
q('Conditionals','What is the final fill?','x = 250\nif x > 100:\n    orb.fill = \'red\'\nelif x > 200:\n    orb.fill = \'blue\'\nelse:\n    orb.fill = \'green\'',['red','blue','green','No branch runs.'],0,'An if/elif/else chain runs only the first matching branch. x>100 is already True.');
q('Conditionals','Which condition tests equality?','',['score = 10','score == 10','score => 10','score equals 10'],1,'Python uses == for equality comparisons and = for assignment.');
q('Conditionals','Which click triggers the gold fill?','if mouseX < 200 and mouseY < 200:\n    orb.fill = \'gold\'',['(250, 100)','(100, 250)','(200, 100)','(100, 100)'],3,'Both comparisons must be True. Only (100, 100) has both coordinates less than 200.');
q('Conditionals','Which boundary test should be included for x < 200?','',['Only x=100.','Only x=350.','x=199, x=200, and x=201.','No inputs are needed.'],2,'Testing just below, at, and just above the boundary helps detect mistakes involving < versus <=.');
q('Conditionals','A press occurs at (200, 50). What happens?','def onMousePress(mouseX, mouseY):\n    if mouseX < 200:\n        orb.fill = \'gold\'\n    else:\n        orb.fill = \'blue\'',['The fill becomes gold.','The fill becomes blue.','Both branches run.','No branch runs.'],1,'200 is not less than 200, so the else branch runs.');
q('Conditionals','Which condition allows entry when either switch is active?','',['switchA and switchB','not switchA','switchA or switchB','switchA == False and switchB == False'],2,'or evaluates to True when at least one operand is True, including when both are True.');
q('AP pseudocode','What value is displayed?','PROCEDURE boost(power)\n{\n    DISPLAY(power + 5)\n}\nboost(7)',['5','7','12','power'],2,'The argument 7 becomes the parameter power. DISPLAY receives 7+5, which is 12.');
q('AP pseudocode','What value is displayed?','shield ← 20\nIF (shield ≥ 20)\n{\n    shield ← shield + 10\n}\nELSE\n{\n    shield ← 0\n}\nDISPLAY(shield)',['0','10','20','30'],3,'The condition includes equality. 20≥20 is True, so shield becomes 30.');
q('AP pseudocode','Which is selection in this algorithm?','INPUT a click location\nIF the click is inside the crate\n    change the crate color',['Receiving the click location.','Deciding whether the click is inside the crate.','Storing the instructions in order.','Naming the crate.'],1,'Selection chooses whether a group of instructions runs based on a condition.');
q('AP pseudocode','Which Python statement matches the AP assignment?','AP pseudocode:  points ← points + 1',['points == points + 1','points = points + 1','points ← points == 1','points + 1'],1,'The AP arrow and Python single equals sign both assign the result to the variable.');
q('AP pseudocode','What is displayed?','x ← 8\nIF (x > 5)\n{\n    DISPLAY("A")\n}\nIF (x > 7)\n{\n    DISPLAY("B")\n}',['Only A','Only B','A, then B','Neither A nor B'],2,'These are independent IF statements. Both conditions are True, so both displays run in order.');
q('AP pseudocode','Which test input exposes the error if entry should be allowed at age 13 or older?','IF (age > 13)\n{\n    DISPLAY("Enter")\n}',['10','12','13','20'],2,'At 13 the requirement allows entry, but age>13 is False. The condition should be age≥13.');
const topics=[...new Set(Q.map(q=>q.topic))];
const $=s=>document.querySelector(s), app=$('#app');let game=null,previous='home';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function island(){return `<div class="mapbox"><div class="maptitle"><b>THE KNOWLEDGE ISLAND</b><small>Five zones. One mission.</small></div><svg viewBox="0 0 600 520" role="img" aria-label="Stylized island map with five review zones"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#76b2b3" stroke-opacity=".1"/></pattern></defs><rect width="600" height="520" fill="url(#grid)"/><circle cx="300" cy="275" r="208" fill="none" stroke="#a48dff" stroke-width="38" opacity=".15"/><circle cx="300" cy="275" r="190" fill="none" stroke="#a48dff" stroke-dasharray="6 7"/><path d="M175 113L253 85 326 115 396 108 445 172 433 221 482 280 440 338 436 398 360 438 304 423 256 460 195 417 139 403 120 334 87 290 127 239 112 184Z" fill="#346d65" stroke="#84b6a0" stroke-width="3"/><path d="M254 100L275 178 239 244 297 290 270 360 307 429" fill="none" stroke="#348aa2" stroke-width="18"/><path d="M156 200L257 202 378 187 397 324 316 375 194 343Z" fill="none" stroke="#b4c09a" stroke-width="3" stroke-dasharray="9 6"/><g fill="#4c8a70"><path d="M164 139l25 43h-50zM195 155l22 36h-44zM401 246l25 43h-50zM139 284l25 43h-50zM347 399l22 36h-44z"/></g><g fill="#adc4b2" stroke="#243f46" stroke-width="3"><path d="M172 202h27v24h-27zM203 198h20v33h-20zM353 168h30v25h-30zM385 180h18v28h-18zM366 313h27v24h-27zM193 334h30v23h-30zM297 361h26v26h-26z"/></g><g fill="#d6fb63" stroke="#102b37" stroke-width="4"><circle cx="195" cy="197" r="8"/><circle cx="377" cy="164" r="8"/><circle cx="394" cy="306" r="8"/><circle cx="205" cy="327" r="8"/><circle cx="311" cy="355" r="8"/></g><g fill="#f2ffff" font-family="system-ui" font-weight="800" font-size="12" paint-order="stroke" stroke="#163337" stroke-width="4"><text x="122" y="183">FUNCTION FORT</text><text x="325" y="148">MOUSE MESA</text><text x="346" y="294">PROPERTY PORT</text><text x="118" y="314">CONDITIONAL COVE</text><text x="277" y="413">AP OUTPOST</text></g><g transform="translate(290 252)"><path d="M0-18L14 16 0 9-14 16Z" fill="#fff" stroke="#6fe3ef" stroke-width="3"/><circle r="30" fill="none" stroke="#6fe3ef" opacity=".5"/></g></svg><div class="maplegend"><span>◌ STORM PERIMETER</span><span>◆ CHOOSE YOUR DROP</span></div></div>`}
function home(){previous='home';game=null;app.innerHTML=`<section class="hero"><div><div class="eyebrow">Battle royale meets brain power</div><h1>DROP IN.<br>THINK FAST.<br><em>OUTSMART<br>THE STORM.</em></h1><p class="lead">Loot knowledge. Build defenses. Survive 12 encounters in a Unit 2 review adventure.</p><div class="pills"><span class="pill">${Q.length} original questions</span><span class="pill">Python + AP pseudocode</span><span class="pill">No account needed</span></div><div class="setup"><label>MISSION<select id="mode"><option value="battle">Storm run · 12 questions</option><option value="practice">Practice · no damage</option></select></label><label>PRACTICE TOPIC<select id="filter"><option value="all">All topics</option>${topics.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><button id="start">Ready up →</button></div><p class="small">Untimed. The storm advances after each answer, so you have time to think. Solo play or share one screen with a partner.</p></div>${island()}</section><section class="features"><div class="feature"><b>01 / Drop into a zone</b><p>Choose your first challenge, then rotate across the island.</p></div><div class="feature"><b>02 / Earn your loadout</b><p>Correct answers earn XP, shields, and build materials.</p></div><div class="feature"><b>03 / Learn from every fight</b><p>Get explanations, a topic breakdown, and a downloadable report.</p></div></section><footer>Independent, Fortnite-inspired classroom review. Original artwork and questions. Not affiliated with Epic Games, CMU CS Academy, or College Board. No student data is sent to a server.</footer>`;$('#start').onclick=()=>start($('#mode').value,$('#filter').value);$('#mode').onchange=()=>{$('#filter').disabled=$('#mode').value==='battle'};$('#filter').disabled=true;}
function start(mode,filter='all',custom=null){let groups=topics.map(t=>shuffle(Q.filter(q=>q.topic===t))),pool=[];while(groups.some(g=>g.length))groups.forEach(g=>{if(g.length)pool.push(g.pop())});pool=custom?shuffle(custom):filter==='all'?pool:shuffle(Q.filter(q=>q.topic===filter));if(mode==='battle'){let base=topics.flatMap(t=>shuffle(Q.filter(q=>q.topic===t)).slice(0,2));pool=shuffle([...base,...shuffle(Q.filter(q=>!base.includes(q))).slice(0,2)]);}game={mode,pool,limit:mode==='battle'?12:pool.length,round:0,hp:100,shield:25,mats:0,xp:0,streak:0,history:[],active:null,answered:false,wall:false,scout:false,note:''};drop();}
function stats(){return `<div class="stats"><div class="stat"><small>ENCOUNTER</small><b>${Math.min(game.round+1,game.limit)} <span class="small">/ ${game.limit}</span></b></div><div class="stat"><small>XP EARNED</small><b>${game.xp}</b></div><div class="stat"><small>BUILD MATERIALS</small><b>${game.mats}</b></div><div class="stat"><small>STORM PHASE</small><b>${game.mode==='practice'?'Off':Math.min(4,Math.floor(game.round/3)+1)}</b></div></div>`}
function side(){return `<aside class="panel"><div><div class="eyebrow">Your loadout</div><p class="small">HEALTH <b>${game.hp}</b> / 100</p><div class="bar"><i style="width:${game.hp}%"></i></div><p class="small">SHIELD <b>${game.shield}</b> / 50</p><div class="bar shield"><i style="width:${game.shield*2}%"></i></div><p class="small">${game.mode==='practice'?'Practice: no damage or storm pressure.':`Wrong answer: ${damage()} damage. Shield absorbs damage first.`}</p></div><div class="inventory"><b>Build before answering</b><button class="secondary" id="wall" ${game.mats<20||game.wall||game.answered?'disabled':''}>▥ Wall · 20 mats</button><small>Blocks damage from this question.</small><button class="secondary" id="scout" ${game.mats<15||game.scout||game.answered?'disabled':''}>⌖ Scout · 15 mats</button><small>Removes two wrong choices.</small><div class="statusline" role="status">${esc(game.note)}</div></div></aside>`}
function damage(){return 15+5*Math.floor(game.round/3)}
function drop(){previous='drop';let available=topics.filter(t=>game.pool.some(q=>q.topic===t));app.innerHTML=stats()+`<div class="layout"><div>${island()}</div><section class="panel"><div class="eyebrow">${game.round===0?'Select a drop zone':'Rotate to the next zone'}</div><h2>${game.round===0?'Where are we landing?':'Choose your next encounter.'}</h2><p>Each zone challenges a different Unit 2 skill. No timer—talk through your reasoning.</p>${available.map(t=>`<button class="zonebtn" data-topic="${esc(t)}">${({'Functions':'Function Fort','Mouse events':'Mouse Mesa','Properties & methods':'Property Port','Conditionals':'Conditional Cove','AP pseudocode':'AP Outpost'})[t]}<small>${esc(t)} · ${game.pool.filter(q=>q.topic===t).length} encounters available</small></button>`).join('')}<p class="small">${game.mode==='battle'?'The run samples all five topics. Only zones with questions in the current rotation appear.':'Practice every question in your selected topic set.'}</p><button class="quiet" id="finish">Finish & view report</button></section></div>`;document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>choose(b.dataset.topic));$('#finish').onclick=finish;}
function choose(t){let i=game.pool.findIndex(q=>q.topic===t);game.active=game.pool.splice(i,1)[0];game.answers=shuffle(game.active.answers.map((text,index)=>({text,index})));game.answered=false;game.wall=false;game.scout=false;game.removed=[];game.note='';question();}
function question(){previous='question';let q=game.active;app.innerHTML=stats()+`<div class="layout">${side()}<section class="panel question"><div class="progress"><span>${esc(q.topic)} / QUESTION ${q.id}</span><button class="quiet" id="finish">Finish run</button></div><h2>${esc(q.prompt)}</h2>${q.code?`<pre>${esc(q.code)}</pre>`:''}<div class="answers">${game.answers.map((a,i)=>`<button class="answer ${game.answered?(a.index===q.correct?'correct':a.index===game.selected?'wrong':''):''}" data-answer="${a.index}" ${game.answered||game.removed.includes(a.index)?'disabled':''} ${game.removed.includes(a.index)?'style="visibility:hidden"':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(a.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite">${game.answered?`<div class="feedback"><strong>${game.selected===q.correct?'✓ Supply secured!':`Review this encounter · Correct answer: ${esc(q.answers[q.correct])}`}</strong><p>${esc(q.explanation)}</p><p class="small">${esc(game.reward)}</p><button id="next">${game.hp<=0||game.round+1>=game.limit?'View mission report':'Next encounter →'}</button></div>`:''}</div></section></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));$('#finish').onclick=finish;$('#wall').onclick=()=>{game.mats-=20;game.wall=true;game.note='Wall built. This encounter’s damage is blocked.';question()};$('#scout').onclick=()=>{game.mats-=15;game.scout=true;game.removed=shuffle(q.answers.map((_,i)=>i).filter(i=>i!==q.correct)).slice(0,2);game.note='Scout deployed. Two wrong options removed.';question()};if(game.answered)$('#next').onclick=()=>{game.round++;if(game.hp<=0||game.round>=game.limit||!game.pool.length)finish();else drop();};}
function answer(index){if(game.answered)return;game.answered=true;game.selected=index;let correct=index===game.active.correct;game.history.push({q:game.active,selected:index,correct,scouted:game.scout});if(correct){game.streak++;let xp=100+Math.min(game.streak-1,4)*25;game.xp+=xp;game.mats+=15;game.shield=Math.min(50,game.shield+10);game.reward=`+${xp} XP · +15 materials · +10 shield (cap 50). Streak: ${game.streak}.`;}else{game.streak=0;let d=game.mode==='practice'||game.wall?0:damage(),absorbed=Math.min(game.shield,d);game.shield-=absorbed;game.hp=Math.max(0,game.hp-(d-absorbed));game.reward=d?`${d} damage: ${absorbed} absorbed by shield. Read the explanation before rotating.`:game.wall?'Your wall blocked the damage. Read the explanation to strengthen this skill.':'Practice mode: no damage. Read the explanation and keep learning.';}question();}
function summary(){let h=game.history,n=h.length,c=h.filter(x=>x.correct).length;return {n,c,accuracy:n?Math.round(c/n*100):0};}
function finish(){previous='result';let {n,c,accuracy}=summary();let won=game.mode==='battle'&&n===game.limit&&game.hp>0;app.innerHTML=`<section class="result"><div class="eyebrow">Mission report / ${game.mode==='practice'?'Practice':'Storm run'}</div><h1>${won?'VICTORY ROYALE!':game.hp<=0?'The storm caught you.':n===game.limit?'Practice complete.':'Mission debrief.'}</h1><p>${won?'You survived all 12 encounters. Your knowledge is your best loadout.':'Review your encounters, then drop back in to strengthen your skills.'}</p><div class="stats"><div class="stat"><small>CORRECT</small><b>${c}/${n}</b></div><div class="stat"><small>ACCURACY</small><b>${accuracy}%</b></div><div class="stat"><small>XP</small><b>${game.xp}</b></div><div class="stat"><small>HEALTH LEFT</small><b>${game.hp}</b></div></div><p class="small">Victory measures survival, not mastery. Accuracy includes answers aided by Scout. This report is self-reported practice evidence.</p><table><thead><tr><th>Topic</th><th>Correct / answered</th></tr></thead><tbody>${topics.map(t=>{let a=game.history.filter(x=>x.q.topic===t);return `<tr><td>${esc(t)}</td><td>${a.length?a.filter(x=>x.correct).length+' / '+a.length:'Not attempted'}</td></tr>`}).join('')}</tbody></table><div class="actions"><button id="again">New storm run</button><button class="secondary" id="retry" ${c===n?'disabled':''}>Practice missed questions</button><button class="secondary" id="download">Download report</button><button class="quiet" id="home">Lobby</button></div><h2>Encounter review</h2>${game.history.length?game.history.map((x,i)=>`<article class="reviewitem"><div class="eyebrow">${x.correct?'✓ CORRECT':'↻ REVIEW'} ${x.scouted?'· SCOUT USED':''} / ${esc(x.q.topic)}</div><b>${i+1}. ${esc(x.q.prompt)}</b>${x.q.code?`<pre>${esc(x.q.code)}</pre>`:''}<p>Your answer: ${esc(x.q.answers[x.selected])}</p><p>Correct answer: ${esc(x.q.answers[x.q.correct])}</p><p>${esc(x.q.explanation)}</p></article>`).join(''):'<p>No questions answered yet.</p>'}</section>`;$('#again').onclick=()=>start('battle');$('#home').onclick=home;$('#retry').onclick=()=>start('practice','all',game.history.filter(x=>!x.correct).map(x=>x.q));$('#download').onclick=download;window.scrollTo(0,0);}
function download(){let s=summary();let text=`STORMCODE — UNIT 2 REVIEW\nName / class: __________________________\nDate: ${new Date().toLocaleDateString()}\nMode: ${game.mode}\nCorrect: ${s.c}/${s.n} (${s.accuracy}%)\nXP: ${game.xp}\nHealth: ${game.hp}\nSelf-reported practice; not a verified assessment.\n\n`+game.history.map((x,i)=>`${i+1}. [${x.correct?'Correct':'Review'}${x.scouted?', Scout used':''}] ${x.q.topic}\n${x.q.prompt}\n${x.q.code}\nYour answer: ${x.q.answers[x.selected]}\nCorrect: ${x.q.answers[x.q.correct]}\n${x.q.explanation}\n`).join('\n');let u=URL.createObjectURL(new Blob([text],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download='Stormcode_Unit_2_Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function help(){let saved=previous;app.innerHTML=`<section class="help panel"><div class="eyebrow">Field guide</div><h1>Your knowledge is your loadout.</h1><p>Stormcode is an original battle royale inspired review for CS Academy AP CSP Second Edition Unit 2: Functions, Mouse Events, and Conditionals.</p><h2>How to play</h2><ol><li>Ready up for a 12-question storm run, or choose untimed, damage-free practice.</li><li>Select a zone. Read the Python or AP pseudocode and choose one answer.</li><li>A correct answer earns 100 XP plus a streak bonus, 15 materials, and 10 shield (maximum 50).</li><li>Spend 20 materials on a wall to block one encounter’s damage, or 15 on a Scout to remove two wrong choices.</li><li>Wrong answers deal 15, 20, 25, then 30 damage as the storm advances every three encounters. Shield absorbs damage before health.</li><li>Survive all 12 encounters for victory. Read the debrief and practice missed questions.</li></ol><p>There is no countdown and no aiming or shooting. Health is a game mechanic; use accuracy and explanations to evaluate learning.</p><h2>Classroom play</h2><p>Students can play individually, in pairs, or as teams around one projected screen. Allow 15–25 minutes for a storm run and discussion. Download the mission report or submit a screenshot through Google Classroom. Reports are not sent to the teacher automatically.</p><h2>Coverage</h2><p>Function definitions and calls; parameters and arguments; onMousePress and onMouseRelease; input and event handlers; variables and shape properties; hits, contains, hitsShape, containsShape, and toFront; comparisons, Boolean logic, and branching; AP procedure, assignment, selection, and testing vocabulary. No loops, lists, or recursion questions.</p><h2>Privacy & progress</h2><p>No logins, tracking, external assets, or server storage. Progress stays in this open tab and resets on refresh. Download a report before closing. The game works offline when index.html is downloaded.</p><button id="back">Back to ${saved==='home'?'lobby':'mission'}</button></section>`;$('#back').onclick=()=>{if(!game)home();else if(saved==='question')question();else if(saved==='drop')drop();else finish()};}
$('#helpBtn').onclick=help;home();
</script></body></html>
